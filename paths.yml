# nxsut input/output paths — public template.
#
# Copy this file to `paths_personal.yml` (git-ignored) and fill in YOUR real
# paths; the generator notebooks load `paths_personal.yml` if it exists, else
# this template. Add one block per machine/user and set `user = '<KEY>'` in
# gen_v3.ipynb to select it.

USER:
  raw: "/path/to/Exiobase Hybrid 3.3.18 with VA/flows"          # EXIOBASE Hybrid flow files
  ember: "/path/to/Ember/yearly_full_release_long_format.csv"   # EMBER yearly full release
  export: "/path/to/nxsut"                                      # where generated tables are written
  nxbase_api: "http://127.0.0.1:8000"                           # nxbase query API (default: local)
